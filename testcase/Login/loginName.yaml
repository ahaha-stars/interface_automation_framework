#        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
#      }
#    },
#    "testCase": [
#      {
#        "case_name": "...",
#        "data": { ... },
#        "validation": [ ... ],
#        "extract": { ... }
#      }
#    ]
#  }
#]
#      该元素是一个字典 (Dictionary)：这个字典包含 2 个键值对：baseInfo 和 testCase。