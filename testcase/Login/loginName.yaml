- baseInfo:
    api_name: 用户登录
    url: /dar/user/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 用户名和密码正确登录验证
      data:
        user_name: test01
        passwd: admin123
      validation:
        - eq: { 'status_code': 200 }
        - contains: { 'msg': '登录成功' }
      extract:
        token: $.token
#
#     最外层是一个列表 (List)：因为它以 - 开头。该列表包含 1 个元素。
